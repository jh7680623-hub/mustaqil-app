name: Build Android APK via Expo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Unzip project
        run: |
          unzip mustaqil-project-export.zip -d extracted_app

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build APK on Expo Cloud
        run: |
          cd extracted_app/messenger-app/mobile
          eas build -p android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

