name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Unzip project
        run: |
          unzip mustaqil-project-export.zip -d extracted_app

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution:  zulu 
          java-version:  17 

      - name: Install Expo CLI & Dependencies
        run: |
          cd extracted_app/messenger-app/mobile
          npm install -g eas-cli expo-cli
          npm install
          npx expo prebuild --platform android --clean --no-install

      - name: Build APK with Gradle
        run: |
          cd extracted_app/messenger-app/mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: extracted_app/messenger-app/mobile/android/app/build/outputs/apk/release/*.apk

